<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Crackpilot — Live AI Interview Assist &amp; Prep Workspace</title>
    <meta
      name="description"
      content="Real-time always-on-top AI interview copilot with Target Profile Resume & JD sync, token authentication, headphone audio capture, screen capture, and video page scan."
    />
    <meta property="og:title" content="Crackpilot — Live AI Interview Assist & Prep Workspace" />
    <meta
      property="og:description"
      content="Real-time always-on-top AI interview copilot with Target Profile Resume & JD sync, token authentication, headphone audio capture, screen capture, and video page scan."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#080d18] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-100">
    <div id="root">
      <div
        id="cp-boot-shell"
        style="height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:#080d18;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;"
      >
        <div style="text-align:center;max-width:360px;">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:#405fe8;color:#fff;font-weight:700;font-size:16px;margin-bottom:12px;">
            C
          </div>
          <div id="cp-boot-title" style="font-size:14px;font-weight:600;color:#f8fafc;">
            Starting Crackpilot...
          </div>
          <div id="cp-boot-msg" style="font-size:12px;color:#94a3b8;margin-top:6px;">
            Loading live overlay interface
          </div>
          <button
            id="cp-boot-retry"
            type="button"
            onclick="window.location.reload()"
            style="display:none;margin-top:14px;padding:8px 16px;border-radius:8px;border:none;background:#405fe8;color:#fff;font-size:12px;font-weight:600;cursor:pointer;"
          >
            Reload Crackpilot
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showBootError(msg) {
          if (window.__CRACKPILOT_MOUNTED__) return;
          var titleEl = document.getElementById("cp-boot-title");
          var msgEl = document.getElementById("cp-boot-msg");
          var btnEl = document.getElementById("cp-boot-retry");
          if (titleEl) titleEl.textContent = "Crackpilot Startup Recovery";
          if (msgEl) msgEl.textContent = msg || "Unable to load application bundle. Check your connection and reload.";
          if (btnEl) btnEl.style.display = "inline-block";
        }
        window.addEventListener("error", function (ev) {
          if (!window.__CRACKPILOT_MOUNTED__) {
            showBootError((ev && ev.message) ? "Startup error: " + ev.message : "Failed to load Crackpilot scripts.");
          }
        });
        window.addEventListener("unhandledrejection", function (ev) {
          if (!window.__CRACKPILOT_MOUNTED__) {
            var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : "Unhandled startup error.";
            showBootError(reason);
          }
        });
        window.setTimeout(function () {
          if (!window.__CRACKPILOT_MOUNTED__) {
            showBootError("App initialization took too long. Click Reload to fetch the latest live bundle.");
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
